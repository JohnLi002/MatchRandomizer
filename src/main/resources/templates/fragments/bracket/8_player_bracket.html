<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU"
          crossorigin="anonymous">

</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
        crossorigin="anonymous"></script>


<h1>Bracket</h1>
<br/>

<div class="container text-center">
    <div class="row">
        <div class="col">
            <span>Round 1</span>
        </div>
        <div class="col">
            <span>Round 2</span>
        </div>
        <div class="col">
            <span>Round 3</span>
        </div>
    </div>
</div>

<div class="container text-center">
    <div class="row">
        <div class="col align-self-center">
            <table class = "table table-borderless">
                <tr th:each="match : ${round1_list}">
                    <td>
                        <div class="container text-center">
                            <div class="row">
                                <div class="col align-self-center">
                                    <div class="card">
                                        <span>
                                            <u><p th:text="'Match ID: ' + ${match.match_id}"></p></u>
                                            <p th:text="${match.player1}" th:style="${match.player1_id == match.winner_id} ? 'color: green;'"></p>
                                            <br/>
                                            <p th:text="${match.player2}" th:style="${match.player2_id == match.winner_id} ? 'color: green;'"></p>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
        <div class="col align-self-center">
            <table class = "table table-borderless">
                <tr th:each="match : ${round2_list}">
                    <td>
                        <div class="container text-center">
                            <div class="row">
                                <div class="col align-self-center">
                                    <div class="card">
                                        <span>
                                            <u><p th:text="'Match ID: ' + ${match.match_id}"></p></u>
                                            <p th:text="${match.player1}" th:style="${match.player1_id == match.winner_id} ? 'color: green;'"></p>
                                            <br/>
                                            <p th:text="${match.player2}" th:style="${match.player2_id == match.winner_id} ? 'color: green;'"></p>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
        <div class="col align-self-center">
            <table class = "table table-borderless">
                <tr th:each="match : ${round3_list}">
                    <td>
                        <div class="container text-center">
                            <div class="row">
                                <div class="col align-self-center">
                                    <div class="card">
                                        <span>
                                            <u><p th:text="'Match ID: ' + ${match.match_id}"></p></u>
                                            <p th:text="${match.player1}" th:style="${match.player1_id == match.winner_id} ? 'color: green;'"></p>
                                            <br/>
                                            <p th:text="${match.player2}" th:style="${match.player2_id == match.winner_id} ? 'color: green;'"></p>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>


</body>
</html>
