<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU"
          crossorigin="anonymous">

</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
        crossorigin="anonymous"></script>


<h1>Bracket</h1>
<table class = "table table-bordered">
    <tr>
        <th style="text-align: center;">Round 1</th>
        <th style="text-align: center;">Winner</th>
    </tr>
    <br/>
    <tr th:each="match : ${match_list}">
        <td>
            <div class="container text-center">
                <div class="row">
                    <div class="col align-self-center">
                        <div class="card">
                            <span>
                                <u><p th:text="'Match ID: ' + ${match.match_id}"></p></u>
                                <p th:text="${match.player1}" th:style="${match.player1_id == match.winner_id} ? 'color: green;'"></p>
                                <br/>
                                <p th:text="${match.player2}" th:style="${match.player2_id == match.winner_id} ? 'color: green;'"></p>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </td>
        <td>
            <div class="container text-center">
                <div class="row">
                    <div class="col align-self-center">
                        <div class="card">
                            <span>
                                <p th:text="${match.winner} ?: 'N/A'"></p>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </td>
    </tr>


        <!--        <td th:text="${match.player1} + ' vs. ' + ${match.player2} "></td>-->
<!--        <td th:text="${match.winner} ?: 'N/A'"></td>-->
</table>



</body>
</html>
